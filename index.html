<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista Golden - Ecosistema Premium</title>
    <!-- SDK Oficial de Telegram WebApps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root {
            --bg-core: #060814;
            --bg-card: #0b0f19;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff0055;
            --neon-gold: #ffaa00;
            --neon-green: #00ff66;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --border-glow: rgba(0, 240, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-core);
            color: var(--text-main);
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* --- HEADER / TOP BAR --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: #060814;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .user-pill span {
            font-size: 0.8rem;
            font-weight: 600;
        }

        .user-pill .avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        /* Bordes Dinámicos de Perfil */
        .avatar-premium-border {
            border: 2px solid var(--neon-gold) !important;
            box-shadow: 0 0 8px var(--neon-gold);
        }
        .avatar-free-border {
            border: 1.5px solid var(--text-muted) !important;
        }

        /* --- CONTENEDOR DE FILTROS ESTILO AMAZON --- */
        .amazon-filter-wrapper {
            background: #090d1a;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 8px 0;
            position: sticky;
            top: 53px;
            z-index: 99;
        }

        .amazon-scroll-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 16px;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }
        .amazon-scroll-row::-webkit-scrollbar { display: none; }

        .tab-tipo-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .tab-tipo-btn.active {
            background: var(--neon-cyan);
            color: #000;
            border-color: var(--neon-cyan);
            font-weight: 700;
        }

        .amazon-sub-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px 2px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .amazon-sub-row::-webkit-scrollbar { display: none; }

        .selector-ordenacion {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.72rem;
            outline: none;
            white-space: nowrap;
        }

        .cat-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .cat-btn.active {
            color: var(--neon-cyan);
            border-bottom: 2px solid var(--neon-cyan);
            border-radius: 0;
        }

        /* --- GRID / TARJETAS --- */
        .catalog-grid {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .servicio-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            transition: transform 0.2s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .card-image-placeholder {
            width: 100%;
            height: 150px;
            position: relative;
            background: #131926;
            overflow: hidden;
        }

        .card-image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 🏷️ CINTA DE DESCUENTO ESQUINA SUPERIOR DERECHA */
        .ribbon-descuento {
            position: absolute;
            top: 15px;
            right: -35px;
            background: linear-gradient(135deg, var(--neon-pink), #b3003b);
            color: #fff;
            text-align: center;
            font-size: 0.62rem;
            font-weight: 800;
            padding: 4px 35px;
            transform: rotate(45deg);
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            z-index: 5;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .badge-tipo-flotante {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.6rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 2;
        }
        .badge-servicio { background: #0284c7; color: #fff; }
        .badge-suscripcion { background: #7c3aed; color: #fff; }
        .badge-producto { background: #16a34a; color: #fff; }
        .badge-anuncio { background: #eab308; color: #000; }

        .card-body-flex {
            display: flex;
            padding: 14px;
            gap: 12px;
            justify-content: space-between;
        }

        .card-left-info { flex: 1; }
        .card-title-clickable, .card-desc-clickable {
            cursor: pointer;
        }
        .card-title-clickable {
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .rating-clickable {
            font-size: 0.7rem;
            color: #fbbf24;
            display: inline-block;
            cursor: pointer;
            background: rgba(251, 191, 3, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(251, 191, 3, 0.1);
        }

        .card-right-pricing {
            text-align: right;
            min-width: 80px;
        }

        .simulador-deseos-box {
            background: rgba(255, 0, 85, 0.01);
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            padding: 8px 14px;
            font-size: 0.68rem;
            color: #94a3b8;
        }

        .acordeon-contenido {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease-out;
            padding: 0 14px;
            background: rgba(0,0,0,0.1);
            font-size: 0.72rem;
        }
        .acordeon-contenido.open {
            max-height: 200px;
            padding: 12px 14px;
        }

        .card-actions-row {
            display: flex;
            padding: 12px 14px;
            gap: 10px;
        }

        .btn-wishlist {
            flex: 1;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-wishlist.active {
            background: rgba(255, 0, 85, 0.1);
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        .btn-contratar {
            flex: 1.4;
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            border: none;
            color: #000;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
        }

        /* --- VISTAS AUXILIARES --- */
        .view-section { display: none; padding: 16px; }
        .view-fade-in { animation: fadeIn 0.3s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        /* --- PERFIL DE USUARIO MODERNO --- */
        .perfil-header {
            text-align: center;
            padding: 24px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 20px;
            position: relative;
        }
        .big-avatar-container {
            position: relative;
            width: 82px;
            height: 82px;
            margin: 0 auto 14px auto;
        }
        .big-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            box-sizing: border-box;
        }
        .big-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        /* 🏷️ ETIQUETA FLOTANTE CENTRADA ABAJO EN IMAGEN */
        .badge-status-avatar {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 0.58rem;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 10px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }
        .badge-avatar-premium {
            background: linear-gradient(135deg, var(--neon-gold), #b37400);
            color: #000;
        }
        .badge-avatar-free {
            background: #334155;
            color: #cbd5e1;
        }

        .panel-container-historial { margin-bottom: 20px; }
        .panel-title { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; font-weight: 800; letter-spacing: 0.5px; }
        
        /* Tarjetas interactivas del historial */
        .panel-item-data { 
            background: var(--bg-card); 
            padding: 14px; 
            border-radius: 10px; 
            margin-bottom: 8px; 
            border: 1px solid rgba(255,255,255,0.02); 
            cursor: pointer;
            transition: background 0.2s;
        }
        .panel-item-data:transparent-hover {
            background: rgba(255,255,255,0.02);
        }
        
        .badge-estado-pago {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 4px;
            margin-top: 6px;
            text-transform: uppercase;
        }
        .status-pagado { background: rgba(22, 163, 74, 0.15); color: #22c55e; border: 1px solid rgba(22, 163, 74, 0.3); }
        .status-esperando { background: rgba(234, 179, 8, 0.15); color: #eab308; border: 1px solid rgba(234, 179, 8, 0.3); }
        .status-verificando { background: rgba(6, 182, 212, 0.15); color: #06b6d4; border: 1px solid rgba(6, 182, 212, 0.3); }
        
        /* --- MODAL GLOBAL EXCLUSIVO CYBERPUNK --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(4, 6, 14, 0.92);
            backdrop-filter: blur(6px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-card {
            background: #0d1321;
            border: 1px solid var(--neon-cyan);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 22px;
            box-shadow: 0 0 35px rgba(0,240,255,0.15);
            animation: modalScaleUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes modalScaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-title { font-size: 1.05rem; font-weight: 900; line-height: 1.3; color: #fff; }
        .modal-divider { border: 0; height: 1px; background: rgba(255,255,255,0.08); margin: 14px 0; }
        .modal-field { margin-bottom: 12px; }
        .modal-field label { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; font-weight: 700; }
        .modal-field select { width: 100%; background: #060913; border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; color: #fff; font-size: 0.8rem; outline: none; }
        .modal-price-box { background: rgba(0,240,255,0.03); border: 1px solid rgba(0,240,255,0.1); padding: 12px; border-radius: 8px; text-align: center; font-weight: 900; font-size: 1rem; color: var(--neon-cyan); margin: 16px 0; }
        .modal-actions { display: flex; gap: 10px; }
        .btn-modal-cancelar { flex: 1; background: rgba(255,255,255,0.04); border: 0; color: #fff; padding: 11px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
        .btn-modal-confirmar { flex: 1.5; background: var(--neon-cyan); border: 0; color: #000; padding: 11px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; cursor: pointer; }

        /* --- NOTIFICACIÓN FOMO --- */
        .fomo-banner {
            position: fixed;
            bottom: 74px; left: 16px; right: 16px;
            background: rgba(11, 15, 25, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 90;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.5s ease;
            pointer-events: none;
        }

        /* --- NAVEGACIÓN INFERIOR NATIVA --- */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: #070a14;
            border-top: 1px solid rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            background: none;
            border: none;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            gap: 4px;
        }
        .nav-item.active { color: var(--neon-cyan); }
        .nav-icon { font-size: 1.2rem; }
    </style>
</head>
<body>

    <!-- 🌐 TOP HEADER -->

        function aplicarFiltrosYOrdenacion(listado) {
            const selectSort = document.getElementById('select-sort');
            if (!selectSort) return listado;
            
            const criterio = selectSort.value;
            if (criterio === "barato") {
                listado.sort((a, b) => (a.precio - (a.descuento || 0)) - (b.precio - (b.descuento || 0)));
            } else if (criterio === "descuento") {
                listado.sort((a, b) => (b.descuento || 0) - (a.descuento || 0));
            } else if (criterio === "ofertas") {
                listado = listado.filter(item => item.oferta && item.oferta.includes("Flash"));
            } else {
                listado.sort((a, b) => parseFloat(b.rating || 0) - parseFloat(a.rating || 0));
            }
            return listado;
        }

        // Motor Core de Procesamiento del Catálogo
        function renderizerEcosistemaActual(cargarMas = false) {
            const grid = document.querySelector('.catalog-grid');
            if (!grid) return;

            if (!cargarMas) { 
                grid.innerHTML = ""; 
                tarjetasDesplegadasActualmente = 10; 
            }

            let sourceData = [];
            if (catalogoActualActivo === "servicios") sourceData = window.CATALOGO_SERVICIOS || [];
            else if (catalogoActualActivo === "canales") sourceData = window.CATALOGO_CANALES || [];
            else if (catalogoActualActivo === "anuncios") sourceData = window.CATALOGO_ANUNCIOS || [];

            let listadoFiltrado = [...sourceData];

            if (filtroTipoActivo !== "todos") {
                listadoFiltrado = listadoFiltrado.filter(item => item.tipo === filtroTipoActivo);
            }

            if (filtroCategoriaActiva !== "todos") {
                listadoFiltrado = listadoFiltrado.filter(item => item.categoria === filtroCategoriaActiva);
            }

            listadoFiltrado = aplicarFiltrosYOrdenacion(listadoFiltrado);

            const bloquePaginado = listadoFiltrado.slice(0, tarjetasDesplegadasActualmente);
            let html = "";
            
            bloquePaginado.forEach(item => { html += generarTarjetaInyectableHTML(item); });

            const trigger = document.getElementById('trigger-lazy-load');
            if (trigger) trigger.remove();

            if (cargarMas) grid.insertAdjacentHTML('beforeend', html);
            else grid.innerHTML = html;

            if (listadoFiltrado.length === 0) {
                grid.innerHTML = `
                    <div style="text-align:center; padding: 40px 20px; color:#64748b; width:100%; font-size:0.8rem;">
                        📡 Sin respuestas en este espectro. Filtros cruzados vacíos.
                    </div>
                `;
            }

            if (listadoFiltrado.length > tarjetasDesplegadasActualmente) {
                grid.insertAdjacentHTML('beforeend', `
                    <div id="trigger-lazy-load" style="text-align:center; padding:10px 0; width:100%;">
                        <button onclick="tarjetasDesplegadasActualmente+=10; renderizerEcosistemaActual(true);" style="background:rgba(255,255,255,0.03); border:1px solid rgba(0,240,255,0.2); color:#00f0ff; padding:10px; border-radius:12px; font-size:0.75rem; font-weight:bold; cursor:pointer; width:100%;">Desplegar Más Conexiones ⬇️</button>

            }
        }

        function cargarPaginaDeseosOriginales() {
            const contenedorGrid = document.getElementById('wishlist-original-grid');
            if (!contenedorGrid) return;
            contenedorGrid.innerHTML = "";
            let deseosLocales = JSON.parse(localStorage.getItem('lista_deseos_golden')) || [];

            if (deseosLocales.length === 0) {
                contenedorGrid.innerHTML = `<p style="color:#64748b; font-size:0.75rem; text-align:center; padding:40px;">No registras ningún módulo guardado.</p>`;
                return;
            }

            const poolGlobal = [...window.CATALOGO_SERVICIOS, ...window.CATALOGO_CANALES, ...window.CATALOGO_ANUNCIOS];
            deseosLocales.forEach(deseo => {
                const itemOriginal = poolGlobal.find(p => p.id === deseo.id);
                if (itemOriginal) contenedorGrid.innerHTML += generarTarjetaInyectableHTML(itemOriginal);
            });
        }

        // 👤 CARGA PANEL DE PERFIL INTEGRANDO DETALLES EXPANSIVOS EN MODALES CYBERPUNK
        function cargarDatosPanelPerfil() {
            const userTelegram = window.Telegram?.WebApp?.initDataUnsafe?.user;
            const userTelegramID = userTelegram?.id || "1320417199";
            const firstName = userTelegram?.first_name || "Usuario Golden";
            
            let rangoFuturista = "⚡ Miembro VIP Ecosistema Synergia";
            if (window.LISTA_USUARIOS_PREMIUM.includes(String(userTelegramID))) {
                rangoFuturista = "👑 Administrador Core Network";
            }

            document.getElementById('perf-nombre').innerText = `👤 ${firstName}`;
            document.getElementById('perf-rango').innerText = `Rango: ${rangoFuturista}`;

            const baseCompras = window.DB_COMPRAS_USUARIOS[userTelegramID] || [];
            const pSubs = document.getElementById('panel-suscripciones');
            const pServs = document.getElementById('panel-servicios');
            const pProds = document.getElementById('panel-productos');
            const pAnunc = document.getElementById('panel-anuncios');

            if (pSubs) pSubs.innerHTML = ""; if (pServs) pServs.innerHTML = ""; if (pProds) pProds.innerHTML = ""; if (pAnunc) pAnunc.innerHTML = "";

            baseCompras.forEach(item => {
                let cssClass = "status-pagado";
                if (item.estadoPago === "esperando") cssClass = "status-esperando";
                if (item.estadoPago === "verificando") cssClass = "status-verificando";

                let stringVigencia = item.fechaInicio && item.fechaFin 
                    ? `Vigencia: ${item.fechaInicio} al ${item.fechaFin}` 
                    : `Fecha Operación: ${item.fechaCompra || 'N/A'}`;

                // Inyección de función controladora onclick para abrir modal con argumentos de datos puros compilados
                let htmlCard = `
                    <div class="panel-item-data view-fade-in" onclick="abrirModalCheckoutEspecifico('${item.idItem}', '${item.tipo}', true, '${item.titulo}', '${item.descLarga || ''}', '${stringVigencia}')">
                        <p style="font-weight:700; font-size:0.85rem; color:#fff;">${item.titulo}</p>
                        <p style="color:#64748b; font-size:0.68rem; margin-top:2px;">${stringVigencia}</p>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="badge-estado-pago ${cssClass}">${item.mensajeEstado}</div>
                            <span style="font-size:0.65rem; color:var(--neon-cyan);">Ver Detalles 🔍</span>
                        </div>
                    </div>
                `;
                
                if (item.tipo === "suscripcion" && pSubs) pSubs.innerHTML += htmlCard;
                if (item.tipo === "servicio" && pServs) pServs.innerHTML += htmlCard;
                if (item.tipo === "producto" && pProds) pProds.innerHTML += htmlCard;
                if (item.tipo === "anuncio" && pAnunc) pAnunc.innerHTML += htmlCard;
            });

            if (pSubs && pSubs.innerHTML === "") pSubs.innerHTML = "<p style='color:#64748b; font-size:0.7rem; padding:4px;'>0 suscripciones activas.</p>";
            if (pServs && pServs.innerHTML === "") pServs.innerHTML = "<p style='color:#64748b; font-size:0.7rem; padding:4px;'>0 servicios en desarrollo.</p>";
            if (pProds && pProds.innerHTML === "") pProds.innerHTML = "<p style='color:#64748b; font-size:0.7rem; padding:4px;'>0 estructuras de software asignadas.</p>";
            if (pAnunc && pAnunc.innerHTML === "") pAnunc.innerHTML = "<p style='color:#64748b; font-size:0.7rem; padding:4px;'>0 campañas publicitarias registradas.</p>";
        }

        // Simuladores Dinámicos Asíncronos
        function iniciarSimuladorContadoresTarjeta() {
            setInterval(() => {
                const pool = [...window.CATALOGO_SERVICIOS, ...window.CATALOGO_CANALES, ...window.CATALOGO_ANUNCIOS];
                if (pool.length === 0) return;
                const item = pool[Math.floor(Math.random() * pool.length)];
                let simKey = `sim_deseos_${item.id}`;
                let simData = JSON.parse(localStorage.getItem(simKey));
                if (simData && Math.random() > 0.4) {
                    simData.count += 1;
                    localStorage.setItem(simKey, JSON.stringify(simData));
                    const dom = document.getElementById(`sim-contador-render-${item.id}`);
                    if (dom) dom.innerText = simData.count;
                }
            }, 8000);
        }

        function ejecutarFomoFlotanteSincronizado() {
            const banner = document.getElementById('fomo-notification');
            const fomoText = document.getElementById('fomo-text');
            if (!banner || !fomoText) return;
            const nombres = ["Nexus_7", "Kaelen", "Alpha_09", "Vesper", "Elysia"];
            const pool = [...window.CATALOGO_SERVICIOS, ...window.CATALOGO_CANALES];
            const item = pool[Math.floor(Math.random() * pool.length)];
            fomoText.innerHTML = `👤 <strong>${nombres[Math.floor(Math.random() * nombres.length)]}</strong> ordenó <span style="color:var(--neon-cyan); font-weight:800;">${item.titulo}</span>`;
            banner.style.opacity = "1"; banner.style.transform = "translateY(0px)";
            setTimeout(() => { banner.style.opacity = "0"; banner.style.transform = "translateY(15px)"; }, 5000);
        }
    </script>
