<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista Golden - Mini App Premium</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div id="fomo-notification" class="fomo-banner">
        <span class="fomo-icon">⚡</span>
        <p id="fomo-text">Cargando actividad...</p>
    </div>

    <div class="app-container">
        
        <header class="app-header">
            <div class="top-bar-user">
                <h1 class="logo-title">🌟 Lista Golden</h1>
                <div class="user-quick-profile">
                    <span id="top-user-name">Cargando...</span>
                    <div id="top-user-avatar" class="telegram-avatar-container"></div>
                </div>
            </div>

            <div id="filter-bar-container" class="filter-wrapper">
                <div class="filter-row categories">
                    <button id="cat-todos" class="filter-btn active" onclick="cambiarCategoria('todos')">Todos</button>
                    <button id="cat-bot" class="filter-btn" onclick="cambiarCategoria('bot')">Bots</button>
                    <button id="cat-grupo" class="filter-btn" onclick="cambiarCategoria('grupo')">Grupos</button>
                    <button id="cat-canal" class="filter-btn" onclick="cambiarCategoria('canal')">Canales</button>
                </div>
                <div class="filter-row advanced-sort">
                    <select id="select-sort" onchange="renderizerEcosistemaActual(false)">
                        <option value="destacados">⭐ Destacados</option>
                        <option value="barato">💰 Más Barato</option>
                        <option value="descuento">📉 Mayor Descuento</option>
                        <option value="ofertas">🔥 Ofertas Flash</option>
                    </select>
                </div>
            </div>
        </header>

        <main class="content-area">
            <div class="catalog-grid"></div>

            <div id="perfil-usuario-view" style="display: none;">
                <div class="perfil-card-header">
                    <div id="page-user-avatar" class="telegram-avatar-container big"></div>
                    <div>
                        <h2 id="perf-nombre">👤 Cargando...</h2>
                        <p id="perf-rango">Rango: ...</p>
                    </div>
                </div>

                <div class="panel-seccion">
                    <h3 class="panel-titulo">💎 Tus Suscripciones Activas</h3>
                    <div id="panel-suscripciones" class="panel-cuerpo"></div>
                </div>
                <div class="panel-seccion">
                    <h3 class="panel-titulo">🛠️ Servicios en Desarrollo</h3>
                    <div id="panel-servicios" class="panel-cuerpo"></div>
                </div>
                <div class="panel-seccion">
                    <h3 class="panel-titulo">📦 Productos Comprados</h3>
                    <div id="panel-productos" class="panel-cuerpo"></div>
                </div>
                <div class="panel-seccion">
                    <h3 class="panel-titulo">🚀 Historial de Anuncios</h3>
                    <div id="panel-anuncios" class="panel-cuerpo"></div>
                </div>
            </div>

            <div id="lista-deseos-view" style="display: none;">
                <div class="perfil-card-header" style="background: linear-gradient(135deg, #4c0519, #1c2541);">
                    <h2 style="font-size: 1.1rem; color: #fff;">❤️ Mi Lista de Deseos Individual</h2>
                    <p style="font-size: 0.75rem; color: #fda4af;">Tus servicios guardados con su diseño original</p>
                </div>
                <div id="wishlist-original-grid" class="catalog-grid"></div>
            </div>
        </main>

        <nav class="bottom-nav">
            <button id="nav-servicios" class="nav-item active" onclick="navegarA('servicios')">
                <span class="nav-icon">🛠️</span><span class="nav-text">Servicios</span>
            </button>
            <button id="nav-canales" class="nav-item" onclick="navegarA('canales')">
                <span class="nav-icon">📢</span><span class="nav-text">Canales</span>
            </button>
            <button id="nav-anuncios" class="nav-item" onclick="navegarA('anuncios')">
                <span class="nav-icon">🚀</span><span class="nav-text">Anuncios</span>
            </button>
            <button id="nav-deseos" class="nav-item" onclick="navegarA('deseos')">
                <span class="nav-icon">❤️</span><span class="nav-text">Mis Deseos</span>
            </button>
            <button id="nav-perfil" class="nav-item" onclick="navegarA('perfil')">
                <span class="nav-icon">👤</span><span class="nav-text">Perfil</span>
            </button>
        </nav>
    </div>

    <div id="checkout-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card" id="modal-dinamico-cuerpo"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
