<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista Golden - Mini App SaaS</title>
    <link rel="stylesheet" href="styles.css">
    <!-- SDK Oficial de Telegram WebApps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- 🔔 BANNER DE NOTIFICACIONES FOMO COLECTIVO -->
    <div id="fomo-notification" class="fomo-banner">
        <span class="fomo-icon">⚡</span>
        <p id="fomo-text">Cargando actividad reciente...</p>
    </div>

    <div class="app-container">
        
        <!-- 🧭 NAVEGACIÓN Y CABECERA (Con sincronización superior de perfil) -->
        <header class="app-header">
            <div class="top-bar-user">
                <h1 class="logo-title">🌟 Lista Golden</h1>
                
                <!-- Datos rápidos de Telegram en barra superior -->
                <div class="user-quick-profile">
                    <span id="top-user-name">Cargando...</span>
                    <div id="top-user-avatar" class="telegram-avatar-container"></div>
                </div>
            </div>

            <div class="catalog-tabs">
                <button id="tab-btn-servicios" class="tab-link active" onclick="switchCatalog('servicios')">🛠️ Servicios</button>
                <button id="tab-btn-canales" class="tab-link" onclick="switchCatalog('canales')">📢 Canales</button>
                <button id="tab-btn-anuncios" class="tab-link" onclick="switchCatalog('anuncios')">🚀 Anuncios</button>
                <button id="tab-btn-perfil" class="tab-link tab-perfil-btn" onclick="switchCatalog('perfil')">👤 Mi Perfil</button>
            </div>
        </header>

        <!-- 🔍 BARRA DE FILTROS DINÁMICOS (Solo visible en Catálogo de Servicios) -->
        <div id="filter-bar-container" class="filter-bar">
            <button class="filter-btn active" onclick="cambiarFiltroCategoria('todos', this)">Todos</button>
            <button class="filter-btn" onclick="cambiarFiltroCategoria('bot', this)">Bots</button>
            <button class="filter-btn" onclick="cambiarFiltroCategoria('grupo', this)">Grupos</button>
            <button class="filter-btn" onclick="cambiarFiltroCategoria('canal', this)">Canales</button>
        </div>

        <!-- 🏛️ CONTENEDOR DE CONTENIDO PRINCIPAL -->
        <main class="content-area">
            
            <!-- VISTA A: GRILLA DE LOS CATÁLOGOS -->
            <div class="catalog-grid"></div>

            <!-- VISTA B: PÁGINA PERFIL DE USUARIO (Paneles Estructurados por Tipo) -->
            <div id="perfil-usuario-view" style="display: none;">
                
                <!-- Tarjeta Principal del Cliente -->
                <div class="perfil-card-header">
                    <div id="page-user-avatar" class="telegram-avatar-container big"></div>
                    <div>
                        <h2 id="perf-nombre">👤 Cargando Usuario...</h2>
                        <p id="perf-rango">Rango: Verificando...</p>
                    </div>
                </div>

                <!-- PANEL 1: SUSCRIPCIONES -->
                <div class="panel-seccion">
                    <h3 class="panel-titulo">💎 Tus Suscripciones Activas</h3>
                    <div id="panel-suscripciones" class="panel-cuerpo"></div>
                </div>

                <!-- PANEL 2: SERVICIOS CONTRATADOS -->
                <div class="panel-seccion">
                    <h3 class="panel-titulo">🛠️ Servicios en Desarrollo</h3>
                    <div id="panel-servicios" class="panel-cuerpo"></div>
                </div>

                <!-- PANEL 3: PRODUCTOS ADQUIRIDOS -->
                <div class="panel-seccion">
                    <h3 class="panel-titulo">📦 Productos Comprados</h3>
                    <div id="panel-productos" class="panel-cuerpo"></div>
                </div>

                <!-- PANEL 4: CAMPAÑAS DE ANUNCIOS -->
                <div class="panel-seccion">
                    <h3 class="panel-titulo">🚀 Historial de Anuncios</h3>
                    <div id="panel-anuncios" class="panel-cuerpo"></div>
                </div>

                <!-- PANEL 5: LISTA DE DESEOS (Persistencia Local) -->
                <div class="panel-seccion">
                    <h3 class="panel-titulo panel-titulo-deseos">❤️ Mi Lista de Deseos</h3>
                    <div id="panel-deseos" class="panel-cuerpo"></div>
                </div>
            </div>

        </main>
    </div>

    <!-- 💳 MODAL INVISIBLE DE COMPRA / CHECKOUT -->
    <div id="checkout-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2 id="modal-titulo" class="modal-title">Confirmar Pedido</h2>
            <hr class="modal-divider">
            
            <div class="modal-field">
                <label for="select-entrega">Plazo de entrega:</label>
                <select id="select-entrega" onchange="actualizarPrecioTotalModal()">
                    <option value="estandar">Estándar (Base incluida)</option>
                    <option value="urgente_48">Urgente 48h (+10€)</option>
                    <option value="critico_24">Crítico 24h (+20€)</option>
                </select>
            </div>

            <div class="modal-field">
                <label for="select-pago">Método de pago preferido:</label>
                <select id="select-pago">
                    <option value="PayPal">PayPal / Tarjeta</option>
                    <option value="Crypto">Criptomonedas (USDT/TON)</option>
                    <option value="Balance">Saldo de la Cuenta</option>
                </select>
            </div>

            <div class="modal-price-box">
                Total a pagar: <span id="modal-precio-final">0</span>€
            </div>

            <div class="modal-actions">
                <button class="btn-modal-cancelar" onclick="cerrarModalCheckout()">Cancelar</button>
                <button id="btn-confirmar-modal" class="btn-modal-confirmar" onclick="procesarEnvioPedidoTelegram()">Confirmar y Enviar 🚀</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
