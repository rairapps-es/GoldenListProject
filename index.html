<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista Golden - Ecosistema Premium</title>

    <style>
        :root {
            --bg-core: #060814;
            --bg-card: #0b0f19;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff0055;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --border-glow: rgba(0, 240, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-core);
            color: var(--text-main);
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* --- HEADER / TOP BAR --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: linear-gradient(to bottom, #090d1a, var(--bg-core));
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-pill span {
            font-size: 0.8rem;
            font-weight: 600;
        }

        .user-pill .avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid var(--neon-cyan);
        }

        .user-pill .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- FILTROS DE PESTAÑA SUPERIOR (FILTRO A) --- */
        .fila-filtro-tipo {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            padding: 12px 16px;
            background: rgba(11, 15, 25, 0.4);
        }

        .tab-tipo-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 0.68rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            white-space: nowrap;
        }

        .tab-tipo-btn.active {
            background: rgba(0, 240, 255, 0.06);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        /* --- BARRA DE CONTROL (ORDENACIÓN Y FILTRO B) --- */
        .filter-bar-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 4px 16px 12px 16px;
        }

        .selector-ordenacion {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            outline: none;
        }

        .fila-subcategorias {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }
        .fila-subcategorias::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .cat-btn.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* --- GRID / TARJETAS --- */
        .catalog-grid {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .servicio-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.2s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .card-image-placeholder {
            width: 100%;
            height: 160px;
            position: relative;
            background: #131926;
        }

        .card-image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-tipo-flotante {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.6rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 2;
        }
        .badge-servicio { background: #0284c7; color: #fff; }
        .badge-suscripcion { background: #7c3aed; color: #fff; }
        .badge-producto { background: #16a34a; color: #fff; }

        .card-body-flex {
            display: flex;
            padding: 14px;
            gap: 12px;
            justify-content: space-between;
        }

        .card-left-info { flex: 1; }
        .card-title-clickable {
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 4px;
            cursor: pointer;
        }

        .rating-clickable {
            font-size: 0.7rem;
            color: #fbbf24;
            display: inline-block;
            cursor: pointer;
        }

        .card-right-pricing {
            text-align: right;
            min-width: 80px;
        }

        .simulador-deseos-box {
            background: rgba(255, 0, 85, 0.03);
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            padding: 8px 14px;
            font-size: 0.68rem;
            color: #94a3b8;
        }

        .acordeon-contenido {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease-out;
            padding: 0 14px;
            background: rgba(0,0,0,0.1);
            font-size: 0.72rem;
        }
        .acordeon-contenido.open {
            max-height: 200px;
            padding: 12px 14px;
        }

        .card-actions-row {
            display: flex;
            padding: 12px 14px;
            gap: 10px;
        }

        .btn-wishlist {
            flex: 1;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-wishlist.active {
            background: rgba(255, 0, 85, 0.1);
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        .btn-contratar {
            flex: 1.4;
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            border: none;
            color: #000;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
        }

        /* --- VISTAS AUXILIARES --- */
        .view-section { display: none; padding: 16px; }
        .view-fade-in { animation: fadeIn 0.3s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        /* --- PERFIL DE USUARIO --- */
        .perfil-header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 20px;
        }
        .big-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            margin: 0 auto 12px auto;
            border: 2px solid var(--neon-cyan);
            overflow: hidden;
        }
        .big-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .panel-container-historial { margin-bottom: 16px; }
        .panel-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; font-weight: 800; }
        .panel-item-data { background: var(--bg-card); padding: 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.02); }
        .btn-ver-catalogo { background: rgba(0,240,255,0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px 16px; border-radius: 8px; font-size: 0.75rem; margin-top: 8px; cursor: pointer; }

        /* --- MODAL CHECKOUT --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(4, 6, 14, 0.9);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-card {
            background: #0d1321;
            border: 1px solid rgba(0,240,255,0.2);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0,240,255,0.1);
        }
        .modal-title { font-size: 1rem; font-weight: 800; }
        .modal-divider { border: 0; height: 1px; background: rgba(255,255,255,0.05); margin: 12px 0; }
        .modal-field { margin-bottom: 12px; }
        .modal-field label { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; }
        .modal-field select { width: 100%; background: #060913; border: 1px solid rgba(255,255,255,0.08); padding: 10px; border-radius: 8px; color: #fff; font-size: 0.78rem; outline: none; }
        .modal-price-box { background: rgba(255,255,255,0.02); padding: 12px; border-radius: 8px; text-align: center; font-weight: 800; font-size: 0.9rem; color: var(--neon-cyan); margin: 16px 0; }
        .modal-actions { display: flex; gap: 10px; }
        .btn-modal-cancelar { flex: 1; background: rgba(255,255,255,0.04); border: 0; color: #fff; padding: 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
        .btn-modal-confirmar { flex: 1.5; background: var(--neon-cyan); border: 0; color: #000; padding: 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; cursor: pointer; }

        /* --- NOTIFICACIÓN FOMO --- */
        .fomo-banner {
            position: fixed;
            bottom: 74px; left: 16px; right: 16px;
            background: rgba(11, 15, 25, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 90;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.5s ease;
            pointer-events: none;
        }

        /* --- NAVEGACIÓN INFERIOR NATIVA --- */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: #070a14;
            border-top: 1px solid rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            background: none;
            border: none;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            gap: 4px;
        }
        .nav-item.active { color: var(--neon-cyan); }
        .nav-icon { font-size: 1.2rem; }
    </style>
</head>

            renderizerEcosistemaActual(false);
            iniciarSimuladorContadoresTarjeta();

            setTimeout(ejecutarFomoFlotanteSincronizado, 2500);
            setInterval(ejecutarFomoFlotanteSincronizado, 13000);
        });

        // Enrutador y Navegación
        function navegarA(seccion) {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            
            const viewCatalog = document.querySelector('.catalog-grid');
            const viewPerfil = document.getElementById('perfil-usuario-view');
            const viewDeseos = document.getElementById('lista-deseos-view');
            const filterBar = document.getElementById('filter-bar-container');
            const tabsTipo = document.getElementById('pestañas-tipo-container');

            if (viewCatalog) viewCatalog.style.display = "none";
            if (viewPerfil) viewPerfil.style.display = "none";
            if (viewDeseos) viewDeseos.style.display = "none";
            if (filterBar) filterBar.style.display = "none";
            if (tabsTipo) tabsTipo.style.display = "none";

            const views = [viewCatalog, viewPerfil, viewDeseos].filter(Boolean);
            views.forEach(v => v.classList.remove('view-fade-in'));

            if (seccion === "servicios" || seccion === "canales" || seccion === "anuncios") {
                const navBtn = document.getElementById(`nav-${seccion}`);
                if (navBtn) navBtn.classList.add('active');
                
                if (viewCatalog) {
                    viewCatalog.style.display = "flex";
                    viewCatalog.classList.add('view-fade-in');
                }
                catalogoActualActivo = seccion;
                
                if (filterBar) filterBar.style.display = "flex";
                if (tabsTipo) tabsTipo.style.display = "grid";
                
                renderizerEcosistemaActual(false);
            } 
            else if (seccion === "deseos") {
                const navBtn = document.getElementById('nav-deseos');
                if (navBtn) navBtn.classList.add('active');
                if (viewDeseos) {
                    viewDeseos.style.display = "block";
                    viewDeseos.classList.add('view-fade-in');
                }
                cargarPaginaDeseosOriginales();
            } 
            else if (seccion === "perfil") {
                const navBtn = document.getElementById('nav-perfil');
                if (navBtn) navBtn.classList.add('active');
                if (viewPerfil) {
                    viewPerfil.style.display = "block";
                    viewPerfil.classList.add('view-fade-in');
                }
                cargarDatosPanelPerfil();
            }
        }

        function aplicarFiltrosYOrdenacion(listado) {
            const selectSort = document.getElementById('select-sort');
            if (!selectSort) return listado;
            
            const criterio = selectSort.value;
            if (criterio === "barato") {
                listado.sort((a, b) => (a.precio - (a.descuento || 0)) - (b.precio - (b.descuento || 0)));
            } else if (criterio === "descuento") {
                listado.sort((a, b) => (b.descuento || 0) - (a.descuento || 0));
            } else if (criterio === "ofertas") {
                listado = listado.filter(item => item.oferta && item.oferta.includes("Flash"));
            } else {
                listado.sort((a, b) => parseFloat(b.rating || 0) - parseFloat(a.rating || 0));
            }
            return listado;
        }

        // Controladores de los dos niveles de filtrado cruzado
        function cambiarPestañaTipo(tipo, botonPulsado) {
            filtroTipoActivo = tipo;
            document.querySelectorAll('.tab-tipo-btn').forEach(btn => btn.classList.remove('active'));
            if (botonPulsado) botonPulsado.classList.add('active');
            renderizerEcosistemaActual(false); 
        }

        function cambiarCategoriaFiltro(categoria, botonPulsado) {
            filtroCategoriaActiva = categoria;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            if (botonPulsado) botonPulsado.classList.add('active');
            renderizerEcosistemaActual(false);
        }

        // Motor Core de Procesamiento Visual
        function renderizerEcosistemaActual(cargarMas = false) {
            const grid = document.querySelector('.catalog-grid');
            if (!grid) return;

            if (!cargarMas) { 
                grid.innerHTML = ""; 
                tarjetasDesplegadasActualmente = 10; 
            }

            let sourceData = [];
            if (catalogoActualActivo === "servicios") sourceData = window.CATALOGO_SERVICIOS || [];
            else if (catalogoActualActivo === "canales") sourceData = window.CATALOGO_CANALES || [];
            else if (catalogoActualActivo === "anuncios") sourceData = window.CATALOGO_ANUNCIOS || [];

            let listadoFiltrado = [...sourceData];

            if (filtroTipoActivo !== "todos") {
                listadoFiltrado = listadoFiltrado.filter(item => item.tipo === filtroTipoActivo);
            }

            if (filtroCategoriaActiva !== "todos") {
                listadoFiltrado = listadoFiltrado.filter(item => item.categoria === filtroCategoriaActiva);
            }

            listadoFiltrado = aplicarFiltrosYOrdenacion(listadoFiltrado);

            const bloquePaginado = listadoFiltrado.slice(0, tarjetasDesplegadasActualmente);
            let html = "";
            
            bloquePaginado.forEach(item => { html += generarTarjetaInyectableHTML(item); });

            const trigger = document.getElementById('trigger-lazy-load');
            if (trigger) trigger.remove();

            if (cargarMas) grid.insertAdjacentHTML('beforeend', html);
            else grid.innerHTML = html;

            if (listadoFiltrado.length === 0) {
                grid.innerHTML = `
                    <div style="text-align:center; padding: 40px 20px; color:#64748b; width:100%; font-size:0.8rem;" class="view-fade-in">
                        📡 Sin respuestas en el espectro. Modifica los filtros superiores.
                    </div>
                `;
            }

            if (listadoFiltrado.length > tarjetasDesplegadasActualmente) {
                grid.insertAdjacentHTML('beforeend', `
                    <div id="trigger-lazy-load" style="text-align:center; padding:10px 0; width:100%;">
                        <button onclick="tarjetasDesplegadasActualmente+=10; renderizerEcosistemaActual(true);" style="background:rgba(255,255,255,0.03); border:1px solid rgba(0,240,255,0.2); color:#00f0ff; padding:10px; border-radius:12px; font-size:0.75rem; font-weight:bold; cursor:pointer; width:100%;">Desplegar Más Conexiones ⬇️</button>
                    </div>
                `);
            }
        }

        // Componente Inyectable de Tarjeta Comercial
        function generarTarjetaInyectableHTML(item) {
            const deseosLocales = JSON.parse(localStorage.getItem('lista_deseos_golden')) || [];
            const estaEnDeseos = deseosLocales.some(d => d.id === item.id);
            const precioFinal = item.precio - (item.descuento || 0);

            let tipoTexto = "Servicio"; let tipoClase = "badge-servicio";
            if (item.tipo === "suscripcion") { tipoTexto = "Suscripción"; tipoClase = "badge-suscripcion"; }
            if (item.tipo === "producto") { tipoTexto = "Producto"; tipoClase = "badge-producto"; }

            let simKey = `sim_deseos_${item.id}`;
            let simData = JSON.parse(localStorage.getItem(simKey)) || { count: Math.floor(Math.random() * 40) + 15, timestamp: Date.now() };
            localStorage.setItem(simKey, JSON.stringify(simData));

            const botonDeseosHTML = estaEnDeseos 
                ? `<button class="btn-wishlist active" onclick="controladorDeseosDirecto('${item.id}', '${item.titulo}', this)">❤️ Guardado</button>`
                : `<button class="btn-wishlist" onclick="controladorDeseosDirecto('${item.id}', '${item.titulo}', this)">❤️ Guardar</button>`;

            return `
                <div class="servicio-card view-fade-in">
                    <div class="card-image-placeholder">
                        <div class="badge-tipo-flotante ${tipoClase}">${tipoTexto}</div>
                        <img src="${item.imagen}" alt="Media Network">
                    </div>
                    
                    <div class="card-body-flex">
                        <div class="card-left-info">
                            <h3 class="card-title-clickable" onclick="toggleAcordeon('${item.id}')">👉 ${item.titulo}</h3>
                            <div style="margin: 4px 0;">
                                <div class="rating-clickable" onclick="window.open('https://t.me/ListaGoldenCanalResenas', '_blank')">⭐ ${item.rating || '4.9'} <span style="color:#64748b; font-size:0.65rem;">(Reseñas)</span></div>
                            </div>
                            <p class="descripcion-clickable" onclick="toggleAcordeon('${item.id}')" style="font-size:0.75rem; color:#94a3b8; line-height:1.4;">${item.descripcion_corta}</p>
                        </div>
                        <div class="card-right-pricing">
                            <div style="font-size: 1.15rem; font-weight: 900; color: var(--neon-cyan);">${precioFinal}€</div>
                            ${item.descuento > 0 ? `<div style="font-size: 0.68rem; color: #64748b; text-decoration: line-through;">Antes: ${item.precio}€</div>` : ''}
                        </div>
                    </div>

                    <div class="simulador-deseos-box">🔥 <strong><span id="sim-contador-render-${item.id}">${simData.count}</span></strong> personas guardaron este módulo hoy.</div>

                    <div id="expand-${item.id}" class="acordeon-contenido">
                        <p style="color:#cbd5e1; margin-bottom:4px;"><strong>Módulo Técnico:</strong> ${item.descripcion_larga || 'Especificación de ingeniería optimizada para alta conversión.'}</p>
                        <p style="color:#64748b; font-size:0.68rem;">Plazo de despliegue: ${item.tiempoEntregaBase || 'Inmediato'}</p>
                    </div>

                    <div class="card-actions-row">
                        ${botonDeseosHTML}
                        <button class="btn-contratar" onclick="abrirModalCheckoutEspecifico('${item.id}', '${item.tipo}')">Comprar Módulo 🛍️</button>
                    </div>
                </div>
            `;
        }

        function toggleAcordeon(id) { document.getElementById(`expand-${id}`)?.classList.toggle('open'); }

        function controladorDeseosDirecto(id, titulo, boton) {
            let deseos = JSON.parse(localStorage.getItem('lista_deseos_golden')) || [];
            if (deseos.some(d => d.id === id)) {
                deseos = deseos.filter(d => d.id !== id);
                boton.classList.remove('active'); boton.innerText = "❤️ Guardar";
            } else {
                deseos.push({ id: id, titulo: titulo });
                boton.classList.add('active'); boton.innerText = "❤️ Guardado";
            }
            localStorage.setItem('lista_deseos_golden', JSON.stringify(deseos));
        }

        // Pasarela de Ventas e Interfaz de Transacción
        function abrirModalCheckoutEspecifico(idItem, tipoItem) {
            let fuente = tipoItem === 'servicio' || tipoItem === 'suscripcion' ? window.CATALOGO_SERVICIOS : (tipoItem === 'canal' ? window.CATALOGO_CANALES : window.CATALOGO_ANUNCIOS);
            let item = fuente.find(i => i.id === idItem);
            if (!item) return;

            itemSeleccionadoParaCompra = item;
            const precioBase = item.precio - (item.descuento || 0);
            const contenedorModal = document.getElementById('modal-dinamico-cuerpo');

            let formularioHTML = `
                <h2 class="modal-title">🛠️ Ordenar: ${item.titulo}</h2>
                <hr class="modal-divider">
                <div class="modal-field">
                    <label>Pasarela de Pago:</label>
                    <select id="form-pago">
                        <option value="PayPal">PayPal / Tarjeta de Crédito</option>
                        <option value="USDT">Criptomonedas (USDT-TRC20 / TON)</option>
                        <option value="Estrellas">⭐ Estrellas Oficiales de Telegram</option>
                    </select>
                </div>
                <input type="hidden" id="form-opcion" value="Entrega_Estandar_Verificada">
            `;

            contenedorModal.innerHTML = `
                ${formularioHTML}
                <div class="modal-price-box">Total Neto: <span id="modal-precio-voto">${precioBase}</span>€</div>
                <div class="modal-actions">
                    <button class="btn-modal-cancelar" onclick="cerrarModalCheckout()">Cancelar</button>
                    <button class="btn-modal-confirmar" onclick="compilarYEnviarDatosTelegram('${tipoItem}')">Confirmar Pedido 🚀</button>
                </div>
            `;
            document.getElementById('checkout-modal').style.display = "flex";
        }

        function cerrarModalCheckout() { document.getElementById('checkout-modal').style.display = "none"; itemSeleccionadoParaCompra = null; }

        // Extracción e Integración con el Enlace de Destino Administrativo
        function compilarYEnviarDatosTelegram(tipoItem) {
            if (!itemSeleccionadoParaCompra) return;

            const userTelegram = window.Telegram?.WebApp?.initDataUnsafe?.user;
            const tgID = userTelegram?.id || "1320417199";
            const tgName = userTelegram?.first_name || "Usuario Local Dev";
            const tgUser = userTelegram?.username ? `@${userTelegram.username}` : "Sin_Alias";

            const metodoPago = document.getElementById('form-pago')?.value || "N/A";
            const importeFinal = document.getElementById('modal-precio-voto')?.innerText || "0";

            let mensajeFormateado = `⚡ *NUEVA ORDEN DE COMPRA - LISTA GOLDEN*\n\n`;
            mensajeFormateado += `👤 *Comprador:* ${tgName} (${tgUser})\n`;
            mensajeFormateado += `🆔 *Telegram ID:* \`${tgID}\`\n\n`;
            mensajeFormateado += `📦 *Módulo:* ${itemSeleccionadoParaCompra.titulo}\n`;
            mensajeFormateado += `🆔 *ID Ítem:* \`${itemSeleccionadoParaCompra.id}\`\n`;
            mensajeFormateado += `💳 *Método:* ${metodoPago}\n`;
            mensajeFormateado += `💰 *Importe:* ${importeFinal}€\n\n`;
            mensajeFormateado += `🚀 _Deseo proceder con la activación manual._`;

            const enlaceChatPrivado = `https://t.me/Airdayz?text=${encodeURIComponent(mensajeFormateado)}`;

            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
                window.Telegram.WebApp.openTelegramLink(enlaceChatPrivado);
            } else {
                window.open(enlaceChatPrivado, '_blank');
            }
            cerrarModalCheckout();
        }

        // Renderizado del Almacén de Deseos
        function cargarPaginaDeseosOriginales() {
            const contenedorGrid = document.getElementById('wishlist-original-grid');
            if (!contenedorGrid) return;
            contenedorGrid.innerHTML = "";
            let deseosLocales = JSON.parse(localStorage.getItem('lista_deseos_golden')) || [];

            if (deseosLocales.length === 0) {
                contenedorGrid.innerHTML = `<p style="color:#64748b; font-size:0.75rem; text-align:center; padding:40px;">No registras ningún módulo guardado.</p>`;
                return;
            }

            const poolGlobal = [...window.CATALOGO_SERVICIOS, ...window.CATALOGO_CANALES, ...window.CATALOGO_ANUNCIOS];
            deseosLocales.forEach(deseo => {
                const itemOriginal = poolGlobal.find(p => p.id === deseo.id);
                if (itemOriginal) contenedorGrid.innerHTML += generarTarjetaInyectableHTML(itemOriginal);
            });
        }

        // Panel del Operador
        function cargarDatosPanelPerfil() {
            const userTelegram = window.Telegram?.WebApp?.initDataUnsafe?.user;
            const userTelegramID = userTelegram?.id || "1320417199";
            const firstName = userTelegram?.first_name || "Usuario Golden";
            
            let rangoFuturista = "⚡ Miembro Golden VIP Synergia";
            if (window.LISTA_USUARIOS_PREMIUM.includes(String(userTelegramID))) {
                rangoFuturista = "👑 Administrador Alpha Network";
            }

            document.getElementById('perf-nombre').innerText = `👤 ${firstName}`;
            document.getElementById('perf-rango').innerText = `Rango: ${rangoFuturista}`;

            const baseCompras = window.DB_COMPRAS_USUARIOS[userTelegramID] || [];
            const pSubs = document.getElementById('panel-suscripciones');
            const pServs = document.getElementById('panel-servicios');
            const pProds = document.getElementById('panel-productos');
            const pAnunc = document.getElementById('panel-anuncios');

            if (pSubs) pSubs.innerHTML = ""; if (pServs) pServs.innerHTML = ""; if (pProds) pProds.innerHTML = ""; if (pAnunc) pAnunc.innerHTML = "";

            baseCompras.forEach(item => {
                let htmlCard = `<div class="panel-item-data"><p style="font-weight:700;">${item.titulo}</p><p style="color:var(--neon-cyan); font-size:0.65rem; margin-top:3px;">Estado: ${item.estado}</p></div>`;
                if (item.tipo === "suscripcion" && pSubs) pSubs.innerHTML += htmlCard;
                if (item.tipo === "servicio" && pServs) pServs.innerHTML += htmlCard;
                if (item.tipo === "producto" && pProds) pProds.innerHTML += htmlCard;
            });
        }

        // Simuladores Asíncronos
        function iniciarSimuladorContadoresTarjeta() {
            setInterval(() => {
                const pool = [...window.CATALOGO_SERVICIOS, ...window.CATALOGO_CANALES, ...window.CATALOGO_ANUNCIOS];
                const item = pool[Math.floor(Math.random() * pool.length)];
                let simKey = `sim_deseos_${item.id}`;
                let simData = JSON.parse(localStorage.getItem(simKey));
                if (simData && Math.random() > 0.4) {
                    simData.count += 1;
                    localStorage.setItem(simKey, JSON.stringify(simData));
                    const dom = document.getElementById(`sim-contador-render-${item.id}`);
                    if (dom) dom.innerText = simData.count;
                }
            }, 8000);
        }

        function ejecutarFomoFlotanteSincronizado() {
            const banner = document.getElementById('fomo-notification');
            const fomoText = document.getElementById('fomo-text');
            if (!banner || !fomoText) return;
            const nombres = ["Nexus_7", "Kaelen", "Alpha_09", "Vesper", "Elysia"];
            const pool = [...window.CATALOGO_SERVICIOS, ...window.CATALOGO_CANALES];
            const item = pool[Math.floor(Math.random() * pool.length)];
            fomoText.innerHTML = `👤 <strong>${nombres[Math.floor(Math.random() * nombres.length)]}</strong> ordenó <span style="color:var(--neon-cyan); font-weight:800;">${item.titulo}</span>`;
            banner.style.opacity = "1"; banner.style.transform = "translateY(0px)";
            setTimeout(() => { banner.style.opacity = "0"; banner.style.transform = "translateY(15px)"; }, 5000);
        }
    </script>
</body>
